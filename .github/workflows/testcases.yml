name: Run Code Tests

on:
  push:
    paths:
      - "*.c"
      - "*.cpp"
      - "*.py"
      - "*.java"
  pull_request:
    paths:
      - "*.c"
      - "*.cpp"
      - "*.py"
      - "*.java"
      - "tests/**"

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Ensure previous commit is available

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc g++ openjdk-17-jdk python3

      - name: Detect Changed Files
        id: changed-files
        run: |
          BEFORE_COMMIT="${{ github.event.before }}"
          if [ -z "$BEFORE_COMMIT" ] || ! git cat-file -e "$BEFORE_COMMIT"^{commit}; then
            BEFORE_COMMIT=$(git rev-parse HEAD~1)  # Use last commit as fallback
          fi
          
          CHANGED_FILES=$(git diff --name-only "$BEFORE_COMMIT" HEAD)
          echo "Detected changed files: $CHANGED_FILES"
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No file changes detected. Exiting..."
            exit 1
          fi

          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      - name: Determine File Type
        id: determine-file
        run: |
          if echo "$CHANGED_FILES" | grep -qE 'max_profit\.c$'; then
            echo "language=C" >> $GITHUB_ENV
            echo "language=C" >> $GITHUB_OUTPUT
          elif echo "$CHANGED_FILES" | grep -qE 'max_profit\.cpp$'; then
            echo "language=C++" >> $GITHUB_ENV
            echo "language=C++" >> $GITHUB_OUTPUT
          elif echo "$CHANGED_FILES" | grep -qE 'max_profit\.py$'; then
            echo "language=Python" >> $GITHUB_ENV
            echo "language=Python" >> $GITHUB_OUTPUT
          elif echo "$CHANGED_FILES" | grep -qE 'max_profit\.java$'; then
            echo "language=Java" >> $GITHUB_ENV
            echo "language=Java" >> $GITHUB_OUTPUT
          else
            echo "No relevant file changes detected. Exiting..."
            exit 1
          fi

      - name: Compile and Run C Program
        if: env.language == 'C'
        run: |
          gcc max_profit.c -o max_profit_c
          ./max_profit_c < test_max_profit.c

      - name: Compile and Run C++ Program
        if: env.language == 'C++'
        run: |
          g++ max_profit.cpp -o max_profit_cpp
          ./max_profit_cpp < test_max_profit.cpp

      - name: Run Python Program
        if: env.language == 'Python'
        run: |
          python3 max_profit.py < test_max_profit.py

      - name: Compile and Run Java Program
        if: env.language == 'Java'
        run: |
          javac max_profit.java
          java -cp . MaxProfit < test_max_profit.java